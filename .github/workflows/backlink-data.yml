name: backlink data

# 这个 Skill 的门禁。PR 改到数据层或 SKILL.md 就跑，通不过不合。
# 价值主张是「这里每一条都被真的验证过」，而人工评审挡不住
# 「看起来很合理但其实是猜的」那类条目——只有机器能稳定挡住。
#
# 两个闸门，挡的是两类不同的失败：
#   validate-data.mjs      数据条目本身是不是有证据、cohort 名是不是合法
#   validate-skill-xml.mjs SKILL.md 的 XML 体是不是良构、56 个 <ref>/<law-ref> 是不是都能解析
#
# 后者以前存在但**从来没有被任何地方调用过**（2026-08-24 补进 CI）。
# 它挡的失败尤其阴：正文里裸写一个 `<session>` 或 `--tab <id>` 会被当成标签，
# 从那一行起整个文档静默失衡；而指向已改名文件的 <ref> 看上去完全正常，
# 只有当有人真的去点它时才发现是断的。两种都是「读的时候才炸」，
# 所以必须在合入前挡住。
on:
  pull_request:
    paths:
      - 'backlink/data/**'
      - 'backlink/SKILL.md'
      - 'backlink/references/**'
      - 'backlink/scripts/validate-data.mjs'
      - 'backlink/scripts/validate-skill-xml.mjs'
  push:
    paths:
      - 'backlink/data/**'
      - 'backlink/SKILL.md'
      - 'backlink/references/**'
      - 'backlink/scripts/validate-data.mjs'
      - 'backlink/scripts/validate-skill-xml.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/validate-data.mjs
        working-directory: backlink
      - run: node scripts/validate-skill-xml.mjs
        working-directory: backlink
