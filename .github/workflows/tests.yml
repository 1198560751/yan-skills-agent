name: skill tests

# 仓库里那些「写了但没人跑」的测试。
#
# 2026-08-24 盘点发现：backlink/tests 下 3 个测试、skill-link-check/tests 下 4 个测试
# 全都能跑、全都通过，但**没有任何 workflow 调用它们**——写的时候有人认真写了，
# 之后就再没被执行过。测试不被执行等于没有测试，而且比没有更糟：
# 它会让人以为这块被覆盖了。
#
# 与 backlink-data.yml 分开：那个是数据层门禁，按 paths 触发；
# 这个是代码层测试，任何改动都该跑。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: backlink 单元测试
        run: |
          for t in tests/*.test.mjs; do
            echo "== $t"
            node "$t"
          done
        working-directory: backlink
      - name: rankup Skill 自校验
        run: node rankup/scripts/validate-rankup.mjs
      # 这一条抓的是另外两个校验器都看不到的东西：references/*.md 内部
      # 那些普通 Markdown 链接。首次运行就抓出 4 条老断链，成因全是
      # 「相对基准算错一层」——看上去完全正常，点下去才是断的。
      - name: 全仓文档链接体检
        run: node scripts/check-doc-links.mjs
      # `--help` 打印用法却退出码非零，2026-08-24 一天之内在两个 Skill 里
      # 各犯了一次，加起来 24 个脚本，还有 4 个 --help 直接卡死（起服务器/跑测试）。
      # 后果不是体验差一点：set -e 的批处理会把完全正常的脚本判成坏了。
      - name: 全仓 --help 体检
        run: node scripts/check-help.mjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # 用 unittest 而不是 pytest：这些测试本来就是 unittest 写的，
      # 加一个 pytest 依赖只为了跑 4 个测试不划算。
      - name: skill-link-check 测试
        run: python -m unittest discover -s skill-link-check/tests -v
